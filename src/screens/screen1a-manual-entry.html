<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=800, initial-scale=1" />
  <title>MediKiosk — Step 1a: Manual ABHA / Mobile Entry</title>

  <!-- Google Fonts: Baloo 2 & Noto Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../styles/tokens.css" />

  <style>
    /* ── Step 1a Manual Entry Layout (Fixed 800x1280, No Scrollbar) ── */
    html, body {
      width: 800px;
      height: 1280px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    .kiosk-screen {
      width: 800px;
      height: 1280px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Top Bar (72px) */
    .topbar {
      flex: 0 0 var(--topbar-h);
      background: var(--color-topbar-bg);
      border-bottom: 1px solid var(--color-topbar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--page-px);
    }

    .topbar__brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .topbar__logo-mark {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background: var(--primitive-haritaki-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(44, 37, 32, 0.15);
    }

    .topbar__logo-mark svg { width: 26px; height: 26px; }

    .topbar__name {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      color: var(--primitive-haritaki-deep);
      line-height: 1.1;
    }

    .topbar__sub {
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text-secondary);
    }

    .topbar__controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .audio-btn {
      width: var(--touch-target-audio-btn);
      height: var(--touch-target-audio-btn);
      border-radius: 50%;
      background: var(--color-audio-btn-bg);
      border: 2px solid var(--color-audio-btn-border);
      color: var(--color-audio-btn-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .audio-btn svg { width: 28px; height: 28px; }

    .lang-chips {
      display: flex;
      gap: 6px;
    }

    .lang-chip {
      height: var(--touch-target-min);
      min-width: 58px;
      padding: 0 14px;
      border: 1.5px solid var(--color-border-subtle);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lang-chip.active {
      background: var(--color-btn-primary-bg);
      color: var(--color-btn-primary-text);
      border-color: var(--color-btn-primary-bg);
    }

    /* 5-Step Bar (56px) */
    .stepbar {
      flex: 0 0 var(--stepbar-h);
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .step-track {
      flex: 1;
      height: 2px;
      background: var(--primitive-copper-track);
      margin: 0 8px 18px 8px;
    }

    .step-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .step-dot--active {
      width: 22px;
      height: 22px;
      background: var(--primitive-haritaki-gold);
      border: 3px solid #FFFFFF;
      box-shadow: 0 0 0 2px var(--primitive-haritaki-gold);
    }

    .step-dot--upcoming {
      background: #FFFFFF;
      border: 2px solid var(--color-step-upcoming);
    }

    .step-label {
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
    }

    .step-label--active { color: var(--color-text-primary); font-weight: 700; }
    .step-label--upcoming { color: var(--color-text-secondary); }

    /* Content Zone (1056px, fits entirely without scroll) */
    .content-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px var(--page-px);
      box-sizing: border-box;
      overflow: hidden;
    }

    .screen-header {
      text-align: left;
    }

    .screen-title {
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--color-text-primary);
      margin: 0 0 6px 0;
    }

    .screen-subtext {
      font-family: var(--font-body);
      font-size: 22px;
      line-height: 1.4;
      color: var(--color-text-secondary);
      margin: 0;
    }

    /* Display Card for Number */
    .number-display-card {
      background: var(--color-surface);
      border: 2px solid var(--primitive-haritaki-gold);
      border-radius: var(--radius-card);
      padding: 20px 24px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .number-display-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-type-label {
      font-size: 18px;
      font-weight: 600;
      color: var(--primitive-haritaki-deep);
      letter-spacing: 0.02em;
    }

    .digit-counter {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-secondary);
    }

    .digits-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      min-height: 56px;
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: 700;
      color: var(--color-text-primary);
      letter-spacing: 2px;
      overflow-x: auto;
    }

    .digits-placeholder {
      color: #A89E92;
      font-weight: 500;
      font-size: 32px;
    }

    .cursor-blinker {
      display: inline-block;
      width: 3px;
      height: 42px;
      background: var(--primitive-haritaki-gold);
      animation: blink 1s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Numeric Keypad Grid */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .key-btn {
      height: 82px;
      background: var(--color-surface);
      border: 2px solid var(--color-border-subtle);
      border-radius: var(--radius-card);
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: 700;
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(44, 37, 32, 0.06);
      transition: all var(--transition-tap);
      user-select: none;
    }

    .key-btn:active {
      background: #EFE9DC;
      border-color: var(--primitive-haritaki-gold);
      transform: scale(0.97);
    }

    .key-btn--action {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 600;
      color: var(--primitive-teak-muted);
      background: #FAF8F2;
    }

    .key-btn--action svg { width: 30px; height: 30px; }

    /* Action Bar (96px) */
    .action-bar {
      flex: 0 0 var(--actionbar-h);
      background: var(--color-actionbar-bg);
      border-top: 1px solid var(--color-actionbar-border);
      box-shadow: var(--shadow-actionbar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--page-px);
    }

    .btn-back {
      min-width: var(--touch-target-back-btn);
      height: var(--touch-target-back-btn);
      border-radius: var(--radius-btn);
      background: var(--color-surface);
      border: 2px solid var(--color-border);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 24px;
    }

    .btn-back svg { width: 22px; height: 22px; }

    .btn-primary {
      height: var(--touch-target-primary);
      min-width: 320px;
      padding: 0 36px;
      border-radius: var(--radius-btn);
      background: var(--color-btn-primary-bg);
      border: none;
      color: var(--color-btn-primary-text);
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(200, 138, 34, 0.30);
      transition: opacity var(--transition-tap);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>
<div class="kiosk-screen">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar__brand">
      <div class="topbar__logo-mark">
        <svg viewBox="0 0 22 22" fill="none">
          <path d="M11 3C11 3 5 7 5 12.5C5 16.09 7.69 19 11 19C14.31 19 17 16.09 17 12.5C17 7 11 3 11 3Z" fill="#2C2520"/>
          <path d="M11 6C11 6 7 9.5 7 13C7 15.21 8.79 17 11 17" stroke="#2C2520" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M11 6C11 6 15 9.5 15 13C15 15.21 13.21 17 11 17" stroke="#2C2520" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="11" y1="17" x2="11" y2="20" stroke="#2C2520" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="topbar__name">MediKiosk</div>
        <div class="topbar__sub" data-i18n="topbarSub">All India Institute of Ayurveda</div>
      </div>
    </div>

    <div class="topbar__controls">
      <button class="audio-btn" aria-label="Replay audio" title="Listen (Sarvam TTS)">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>

      <div class="lang-chips" role="radiogroup" aria-label="Language selection">
        <button class="lang-chip active" data-lang="en" role="radio" aria-checked="true">EN</button>
        <button class="lang-chip" data-lang="hi" role="radio" aria-checked="false">हि</button>
        <button class="lang-chip" data-lang="mr" role="radio" aria-checked="false">म</button>
      </div>
    </div>
  </header>

  <!-- 5-STEP BAR (Step 1 Active) -->
  <nav class="stepbar" aria-label="OPD Progress">
    <div class="step-item">
      <div class="step-dot step-dot--active"></div>
      <span class="step-label step-label--active" data-i18n="step1">1. Identity</span>
    </div>
    <div class="step-track"></div>

    <div class="step-item">
      <div class="step-dot step-dot--upcoming"></div>
      <span class="step-label step-label--upcoming" data-i18n="step2">2. Interview</span>
    </div>
    <div class="step-track"></div>

    <div class="step-item">
      <div class="step-dot step-dot--upcoming"></div>
      <span class="step-label step-label--upcoming" data-i18n="step3">3. Documents</span>
    </div>
    <div class="step-track"></div>

    <div class="step-item">
      <div class="step-dot step-dot--upcoming"></div>
      <span class="step-label step-label--upcoming" data-i18n="step4">4. Summary</span>
    </div>
    <div class="step-track"></div>

    <div class="step-item">
      <div class="step-dot step-dot--upcoming"></div>
      <span class="step-label step-label--upcoming" data-i18n="step5">5. Confirm</span>
    </div>
  </nav>

  <!-- CONTENT ZONE -->
  <main class="content-zone">

    <div class="screen-header">
      <h1 class="screen-title" data-i18n="title">Enter ABHA or Mobile Number</h1>
      <p class="screen-subtext" data-i18n="subtext">Use the touch keypad below to enter your 14-digit ABHA or 10-digit mobile number.</p>
    </div>

    <!-- Number Display Field -->
    <div class="number-display-card">
      <div class="number-display-header">
        <span class="input-type-label" id="typeLabel" data-i18n="detectPrompt">ABHA / Mobile Number</span>
        <span class="digit-counter" id="digitCounter">0 / 14 digits</span>
      </div>

      <div class="digits-row">
        <span id="numberText"></span>
        <span class="cursor-blinker"></span>
        <span class="digits-placeholder" id="placeholderText" data-i18n="placeholder">Enter 10 or 14 digits...</span>
      </div>
    </div>

    <!-- 3x4 On-Screen Numeric Keypad -->
    <div class="keypad-grid" role="group" aria-label="Touch Keypad">
      <button class="key-btn" data-key="1">1</button>
      <button class="key-btn" data-key="2">2</button>
      <button class="key-btn" data-key="3">3</button>

      <button class="key-btn" data-key="4">4</button>
      <button class="key-btn" data-key="5">5</button>
      <button class="key-btn" data-key="6">6</button>

      <button class="key-btn" data-key="7">7</button>
      <button class="key-btn" data-key="8">8</button>
      <button class="key-btn" data-key="9">9</button>

      <button class="key-btn key-btn--action" id="btnClear" data-i18n="keyClear">Clear</button>
      <button class="key-btn" data-key="0">0</button>
      <button class="key-btn key-btn--action" id="btnBackSpace" aria-label="Backspace">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/>
        </svg>
      </button>
    </div>

  </main>

  <!-- ACTION BAR -->
  <footer class="action-bar">
    <button class="btn-back" onclick="window.location.href='screen1a-identity.html'" aria-label="Back to Identity Selection">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      <span data-i18n="btnBack">Back</span>
    </button>

    <!-- Proceeds forward to Step 1b: Consent -->
    <button class="btn-primary" id="btnContinue" disabled onclick="window.location.href='screen1b-consent.html'">
      <span data-i18n="btnContinue">Verify &amp; Continue</span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21 12l-8.15-7.85-1.42 1.42L16.86 11H5v2z"/>
      </svg>
    </button>
  </footer>

</div>

<!-- SCRIPT: Keypad & Multilingual Wiring -->
<script>
  let enteredDigits = "";
  const maxDigits = 14;

  const numberText = document.getElementById('numberText');
  const placeholderText = document.getElementById('placeholderText');
  const digitCounter = document.getElementById('digitCounter');
  const typeLabel = document.getElementById('typeLabel');
  const btnContinue = document.getElementById('btnContinue');

  function updateDisplay() {
    if (enteredDigits.length === 0) {
      numberText.textContent = "";
      placeholderText.style.display = "inline";
    } else {
      placeholderText.style.display = "none";
      // Format 10 digits as XXXXX XXXXX, or 14 digits as XX-XXXX-XXXX-XXXX
      if (enteredDigits.length <= 10) {
        let p1 = enteredDigits.substring(0, 5);
        let p2 = enteredDigits.substring(5, 10);
        numberText.textContent = p2 ? `${p1} ${p2}` : p1;
      } else {
        let p1 = enteredDigits.substring(0, 2);
        let p2 = enteredDigits.substring(2, 6);
        let p3 = enteredDigits.substring(6, 10);
        let p4 = enteredDigits.substring(10, 14);
        let parts = [p1, p2, p3, p4].filter(p => p.length > 0);
        numberText.textContent = parts.join(" - ");
      }
    }

    digitCounter.textContent = `${enteredDigits.length} / 14 digits`;

    // Detect type
    if (enteredDigits.length === 10) {
      typeLabel.textContent = "✓ 10-Digit Mobile Number Detected";
      typeLabel.style.color = "var(--primitive-herbal-green)";
    } else if (enteredDigits.length === 14) {
      typeLabel.textContent = "✓ 14-Digit ABHA ID Detected";
      typeLabel.style.color = "var(--primitive-herbal-green)";
    } else {
      typeLabel.textContent = "ABHA or Mobile Number";
      typeLabel.style.color = "var(--primitive-haritaki-deep)";
    }

    // Enable button if 10 or 14 digits entered
    btnContinue.disabled = !(enteredDigits.length === 10 || enteredDigits.length === 14);
  }

  // Keypad click handlers
  document.querySelectorAll('.key-btn[data-key]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (enteredDigits.length < maxDigits) {
        enteredDigits += btn.getAttribute('data-key');
        updateDisplay();
      }
    });
  });

  document.getElementById('btnClear')?.addEventListener('click', () => {
    enteredDigits = "";
    updateDisplay();
  });

  document.getElementById('btnBackSpace')?.addEventListener('click', () => {
    if (enteredDigits.length > 0) {
      enteredDigits = enteredDigits.slice(0, -1);
      updateDisplay();
    }
  });

  // Multilingual translations
  const i18n = {
    en: {
      topbarSub: "All India Institute of Ayurveda",
      step1: "1. Identity",
      step2: "2. Interview",
      step3: "3. Documents",
      step4: "4. Summary",
      step5: "5. Confirm",
      title: "Enter ABHA or Mobile Number",
      subtext: "Use the touch keypad below to enter your 14-digit ABHA or 10-digit mobile number.",
      detectPrompt: "ABHA or Mobile Number",
      placeholder: "Enter 10 or 14 digits...",
      keyClear: "Clear",
      btnBack: "Back",
      btnContinue: "Verify & Continue"
    },
    hi: {
      topbarSub: "अखिल भारतीय आयुर्वेद संस्थान",
      step1: "१. पहचान",
      step2: "२. लक्षण चर्चा",
      step3: "३. दस्तावेज़",
      step4: "४. सारांश",
      step5: "५. पुष्टि",
      title: "आभा या मोबाइल नंबर दर्ज करें",
      subtext: "टच कीपैड द्वारा अपना १४ अंकों का आभा आईडी या १० अंकों का मोबाइल नंबर लिखें।",
      detectPrompt: "आभा या मोबाइल नंबर",
      placeholder: "१० या १४ अंक दर्ज करें...",
      keyClear: "हटाएं",
      btnBack: "पीछे",
      btnContinue: "सत्यापित करें व आगे बढ़ें"
    },
    mr: {
      topbarSub: "अखिल भारतीय आयुर्वेद संस्था",
      step1: "१. ओळख",
      step2: "२. लक्षण तपासणी",
      step3: "३. कागदपत्रे",
      step4: "४. सारांश",
      step5: "५. पुष्टी",
      title: "आभा किंवा मोबाइल नंबर टाका",
      subtext: "खालील टच कीपॅड वापरून आपला १४ अंकी आभा आयडी किंवा १० अंकी मोबाइल नंबर टाका.",
      detectPrompt: "आभा किंवा मोबाइल नंबर",
      placeholder: "१० किंवा १४ अंक टाका...",
      keyClear: "पुसा",
      btnBack: "मागे",
      btnContinue: "सत्यापित करा व पुढे जा"
    }
  };

  function setLanguage(lang) {
    if (!i18n[lang]) return;
    document.documentElement.lang = lang;

    document.querySelectorAll('.lang-chip').forEach(chip => {
      const isMatch = chip.getAttribute('data-lang') === lang;
      chip.classList.toggle('active', isMatch);
      chip.setAttribute('aria-checked', isMatch ? 'true' : 'false');
    });

    const t = i18n[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.textContent = t[key];
    });
  }

  document.querySelectorAll('.lang-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      setLanguage(chip.getAttribute('data-lang'));
    });
  });

  setLanguage('en');
  updateDisplay();
</script>
</body>
</html>
